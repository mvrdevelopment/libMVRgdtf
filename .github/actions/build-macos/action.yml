name: 'Build macOS'
description: 'Build ths packages for MACOS package'
runs:
  using: "composite"
  steps:
    - name: Number of CPUs
      shell: bash
      run: echo "BUILD_JOBS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    # Xerces-C is built for arm64 and x86_64 (about the slowest part); reuse the result between runs
    - name: Xerces-C - cache
      id: cache-xerces
      uses: actions/cache@v4
      with:
        path: xerces-c
        key: xerces-c-3.3.0-macos-arm64-x64-${{ runner.arch }}-v1

    - name: Boost - cache
      id: cache-boost
      uses: actions/cache@v4
      with:
        path: boost
        key: boost-1.86.0-macos-v1

    - name: Xerces-C - prepare
      if: steps.cache-xerces.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir xerces-c
        cd xerces-c
        curl -o xerces-c.zip https://dlcdn.apache.org/xerces/c/3/sources/xerces-c-3.3.0.zip
        tar -xf xerces-c.zip --strip-components=1

    - name: Xerces-C - build arm64
      if: steps.cache-xerces.outputs.cache-hit != 'true'
      shell: bash
      working-directory: xerces-c
      run: |
        ./configure --host=aarch64-apple-darwin --disable-shared --prefix=$(pwd)/_build_mac_arm CFLAGS="-arch arm64" CXXFLAGS="-arch arm64" --enable-xmlch-uint16_t
                make -j$BUILD_JOBS
        make install

    - name: Xerces-C - build x64
      if: steps.cache-xerces.outputs.cache-hit != 'true'
      shell: bash
      working-directory: xerces-c
      run: |
        ./configure --host=x86_64-apple-darwin --disable-shared --prefix=$(pwd)/_build_mac_x64 CFLAGS="-arch x86_64" CXXFLAGS="-arch x86_64" --enable-xmlch-uint16_t
                make -j$BUILD_JOBS
        make install

    - name: Xerces-C - lipo arm/x64
      if: steps.cache-xerces.outputs.cache-hit != 'true'
      shell: bash
      working-directory: xerces-c
      run: lipo _build_mac_arm/lib/libxerces-c.a _build_mac_x64/lib/libxerces-c.a -create -output _build_mac_x64/lib/libxerces-c-all.a

    - name: Boost - prepare
      if: steps.cache-boost.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir boost
        cd boost
        curl -o boost.zip https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip
        tar -xf boost.zip --strip-components=1

    # Builds every variant (with and without mini-zip) for arm64 and x86_64 and merges them into one universal lib per variant
    - name: libMVRGdtf - build universal (arm64 + x86_64)
      shell: bash
      working-directory: libMvrGdtf
      run: |
        set -e
        ROOT="$(pwd)/.."
        mkdir -p libs

        for variant in "full:libMvrGdtf:" "no_mz:libMvrGdtf_NO_MZ:-DDO_NOT_INCLUDE_MINI_ZIP=true"; do
          IFS=: read -r name lib extra <<< "$variant"
          for pair in "arm64:_build_mac_arm" "x86_64:_build_mac_x64"; do
            IFS=: read -r arch xerces <<< "$pair"
            dir="build_mac_${arch}_${name}"
            mkdir "$dir"
            (
              cd "$dir"
              cmake .. -DCMAKE_C_FLAGS="-arch $arch" -DCMAKE_CXX_FLAGS="-arch $arch" $extra \
                -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$(pwd)/out" -DCMAKE_INSTALL_PREFIX:PATH="$(pwd)/libs" \
                -DXERCES_INCLUDE_PATH="$ROOT/xerces-c/$xerces/include" -DXERCES_LIB_PATH="$ROOT/xerces-c/$xerces/lib" -DXERCES_ROOT_PATH="$ROOT/xerces-c/$xerces"
              make -j$BUILD_JOBS
              make install
              libtool -static -o "$(pwd)/merged.a" "$(pwd)/out/$lib.a" "$(pwd)/libs/lib/libmdns_cpp.a" "$ROOT/xerces-c/$xerces/lib/libxerces-c.a"
              lipo -archs "$(pwd)/merged.a"
            )
          done
          lipo -create "build_mac_arm64_${name}/merged.a" "build_mac_x86_64_${name}/merged.a" -output "libs/$lib.a"
          lipo -archs "libs/$lib.a"
        done

    - name: Prepare package
      shell: bash
      working-directory: libMvrGdtf
      run: |
        mkdir -p output/include
        cp -r src/Include/* output/include/
        mkdir -p output/lib
        cp -r libs/* output/lib/
